name: License Check
# Fail if a 3rd-party npm dependency carries a license outside the allowlist.
# No SAST/vuln scanning (deliberately out of scope).
#
# npm only: this repo has no go.mod, and the Go job that used to sit here
# started a runner on every run just to find none. It runs on pull requests
# that change the manifest or lockfile, and not while the PR is a draft; the
# PR run covers what merges, so nothing reruns on push to main.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'package.json'
      - 'package-lock.json'
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  npm:
    name: 📦 npm dependency licenses
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Check dependency licenses
        run: |
          npx --yes license-checker-rseidelsohn \
            --production --excludePrivatePackages \
            --onlyAllow "MIT;ISC;Apache-2.0;BSD-2-Clause;BSD-3-Clause;0BSD;CC0-1.0;Unlicense;BlueOak-1.0.0;Python-2.0;MPL-2.0;CC-BY-4.0"
