name: Actionlint
# Validate the GitHub Actions workflow files. The other PR checks don't verify
# that a workflow is actually runnable, so a malformed one (e.g. an invalid job
# id) can merge green and only fail at startup on main. actionlint catches that
# class at PR time. shellcheck integration is disabled (-shellcheck=) to keep
# the gate focused on workflow validity; drop that flag to also lint run: shell.
#
# Pull requests that touch .github only, and not while the PR is a draft. The
# PR run covers what merges, so nothing reruns on push to main.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/**'
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  actionlint:
    name: 🧹 Actionlint
    if: github.event.pull_request.draft == false
    runs-on: { group: self-hosted-private }
    timeout-minutes: 10
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      # The pinned release binary, checked against the SHA-256 the release
      # publishes (actionlint_<version>_checksums.txt), instead of compiling
      # actionlint from source with `go install` on every run. The runners are
      # arm64 and cannot write to /usr/local/bin, so the architecture is
      # worked out here and the binary lands in RUNNER_TEMP. Update the sums
      # together with VERSION.
      - name: 📦 Install actionlint
        env:
          VERSION: "1.7.12"
          SHA256_AMD64: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          SHA256_ARM64: 325e971b6ba9bfa504672e29be93c24981eeb1c07576d730e9f7c8805afff0c6
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            aarch64|arm64) arch=arm64; sum="$SHA256_ARM64" ;;
            *)             arch=amd64; sum="$SHA256_AMD64" ;;
          esac
          tarball="actionlint_${VERSION}_linux_${arch}.tar.gz"
          mkdir -p "${RUNNER_TEMP}/bin"
          curl -sSfL -o "${RUNNER_TEMP}/${tarball}" \
            "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/${tarball}"
          echo "${sum}  ${RUNNER_TEMP}/${tarball}" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/${tarball}" -C "${RUNNER_TEMP}/bin" actionlint
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"
      - name: 🧹 Run actionlint
        run: actionlint -color -shellcheck=
