name: Release and Publish
on:
  workflow_dispatch:
  workflow_call:
  release:
    types: [released]

permissions:
  contents: read
  # Provenance is signed with the workflow's OIDC identity, so npm can attest
  # that this tarball came from this repository at this commit.
  id-token: write

jobs:
  test:
    name: 🧪 Test
    uses: ./.github/workflows/action-test.yaml

  publish:
    name: 🚀 Publish
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'release'
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Download the build artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: ./

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          registry-url: 'https://registry.npmjs.org'

      # Public npm, so a consumer needs no registry configuration and no token.
      # That is the point of the move: the GitHub Packages registry requires
      # authentication even to read a public package, which shuts out public
      # repositories and anyone cloning one.
      - name: Publish to npm
        uses: JS-DevTools/npm-publish@v4
        with:
          provenance: true
          access: public
          ignore-scripts: true
          token: ${{ secrets.NPM_TOKEN }}
