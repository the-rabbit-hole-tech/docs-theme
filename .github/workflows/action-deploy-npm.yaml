name: Release and Publish
on:
  workflow_dispatch:
  workflow_call:
  release:
    types: [released]

permissions:
  contents: read
  # Provenance is signed with the workflow's OIDC identity, so npm can attest
  # that this tarball came from this repository at this commit.
  id-token: write

jobs:
  test:
    name: 🧪 Test
    uses: ./.github/workflows/action-test.yaml

  publish:
    name: 🚀 Publish
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'release'
    runs-on: arc-runner-set
    needs: [test]
    steps:
      - name: Download the build artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: ./

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          registry-url: 'https://registry.npmjs.org'

      # Public npm, so a consumer needs no registry configuration and no
      # token to install this.
      - name: Publish to npm
        uses: JS-DevTools/npm-publish@v4
        env:
          # setup-node writes `_authToken=${NODE_AUTH_TOKEN}` into the job's
          # .npmrc and exports a placeholder value when nothing supplies one.
          # npm then presents that placeholder as a credential and fails with
          # ENEEDAUTH rather than falling back to the OIDC exchange trusted
          # publishing relies on. Binding it to the secret keeps a real token
          # working while leaving it empty when there is none, which is what
          # lets npm reach for OIDC.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        with:
          provenance: true
          access: public
          ignore-scripts: true
          # Not required with trusted publishing; empty falls through to OIDC.
          token: ${{ secrets.NPM_TOKEN }}
