name: PR Checks
# Authoritative CI enforcement of what the local hooks check (hooks are advisory
# and may not be installed): conventional PR title, a PR body that follows the
# template + references an issue, no AI-tells/emoji in the diff, the gitleaks
# secret scan, and a categorizing label derived from the title.
#
# ONE job, with each check as a step. Each of these checks does a few seconds of
# work, and every job pays for its own runner start and checkout (GitHub bills a
# hosted job for at least a full minute; on arc-runner-set each job still takes a
# pod), so seven separate jobs across three workflows cost seven starts per run
# where one job costs one. Every check step runs with `!cancelled()`, so a
# failing check never hides the ones after it: the log shows every failure, and
# the job fails if any step failed. This job replaces job-gitleaks.yaml and
# job-label-checker.yaml.
#
# Draft PRs are skipped; the run happens when the PR is marked ready. This is the
# only workflow that reacts to `edited`, so a title or body fix reruns one job,
# not the build. An edit reruns every step, not just title and body: the new
# result replaces the last one for the same commit, so skipping hygiene or
# gitleaks on an edit would turn an earlier failure green.
#
# The label steps talk to the REST API with `curl` rather than the `gh` CLI: the
# arc-runner-set image carries neither `gh` nor `jq`.
on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened, ready_for_review]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  contents: read
  # The autolabel step applies the categorizing label.
  pull-requests: write
jobs:
  checks:
    name: ✅ PR Checks
    if: github.event.pull_request.draft == false
    runs-on: arc-runner-set
    timeout-minutes: 10
    steps:
      - name: 📝 PR Title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📄 PR Body
        if: ${{ !cancelled() }}
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          fail=0
          printf '%s' "$BODY" | grep -qiE '(closes|fixes|resolves|refs) #[0-9]+' \
            || { echo "PR body must reference an issue (e.g. 'Closes #12')."; fail=1; }
          printf '%s' "$BODY" | grep -qiE '##[[:space:]]*what' \
            || { echo "PR body must follow the template (a 'What and why' section)."; fail=1; }
          [ "$fail" -eq 0 ] || exit 1

      - name: Checkout
        id: checkout
        if: ${{ !cancelled() }}
        uses: actions/checkout@v6
        with:
          # Full history: gitleaks scans every commit, and hygiene diffs
          # the PR's base against its head.
          fetch-depth: 0

      - name: 🧼 PR Hygiene
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # Reuse the exact rules the local pre-commit hook uses.
          source .claude/hooks/lib.sh
          fail=0
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            case "$f" in
              .git/*) continue ;;
              *.png|*.jpg|*.jpeg|*.gif|*.pdf|*.ico|*.svg|*.woff|*.woff2|*.ttf|*.eot|*.zip|*.gz) continue ;;
            esac
            # Emoji allowed in Markdown and .github; blocked elsewhere.
            case "$f" in
              .github/*|*.md|NOTES.txt|*/NOTES.txt) : ;;
              *) e="$(gov_find_emoji < "$f")"; [ -n "$e" ] && { echo "emoji not allowed in $f:"; echo "$e"; fail=1; } ;;
            esac
            # AI-tells blocked except in files that document the rule.
            case "$f" in
              CLAUDE.md|*/CLAUDE.md|.claude/*|*/.claude/*|.github/workflows/*|*forbidden-text.txt) : ;;
              *) t="$(gov_find_text_tells < "$f")"; [ -n "$t" ] && { echo "AI-tell not allowed in $f:"; echo "$t"; fail=1; } ;;
            esac
          done < <(git diff --name-only --diff-filter=ACM "$BASE" "$HEAD")
          [ "$fail" -eq 0 ] || { echo "pr-hygiene: remove the above before merging."; exit 1; }

      # Secret scan, no paths filter: a secret can land in any file, docs
      # included. Hard failure: the scan exits non-zero on a finding. It runs
      # the gitleaks CLI directly rather than gitleaks/gitleaks-action@v2,
      # which needs a paid GITLEAKS_LICENSE for organization-owned repos; the
      # CLI is free everywhere and matches the `gitleaks detect` run locally.
      - name: Install gitleaks
        id: gitleaks-install
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        # The runners are arm64 and the runner user cannot write to
        # /usr/local/bin, so neither the architecture nor the destination
        # can be assumed. The tarball is checked against the SHA-256 the
        # release publishes (gitleaks_<version>_checksums.txt) before it is
        # unpacked; update the sums together with VERSION.
        env:
          VERSION: "8.30.0"
          SHA256_X64: 79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e
          SHA256_ARM64: b4cbbb6ddf7d1b2a603088cd03a4e3f7ce48ee7fd449b51f7de6ee2906f5fa2f
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            aarch64|arm64) arch=arm64; sum="$SHA256_ARM64" ;;
            *)             arch=x64;   sum="$SHA256_X64" ;;
          esac
          tarball="gitleaks_${VERSION}_linux_${arch}.tar.gz"
          mkdir -p "${RUNNER_TEMP}/bin"
          curl -sSfL -o "${RUNNER_TEMP}/${tarball}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/${tarball}"
          echo "${sum}  ${RUNNER_TEMP}/${tarball}" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/${tarball}" -C "${RUNNER_TEMP}/bin" gitleaks
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"
          "${RUNNER_TEMP}/bin/gitleaks" version

      - name: 🔒 Gitleaks (secret scan)
        if: ${{ !cancelled() && steps.gitleaks-install.outcome == 'success' }}
        run: |
          # Honor a repo-local .gitleaks.toml if present; scan the full tree.
          # An array keeps the optional flag pair intact without word splitting.
          args=(detect --source . --redact --verbose --no-banner)
          if [ -f .gitleaks.toml ]; then args+=(--config .gitleaks.toml); fi
          gitleaks "${args[@]}"

      # Every PR must carry a categorizing label. The label is derived from the
      # conventional-commit title and applied here, then confirmed in the next
      # step. Both live in this job on purpose: GitHub fires no new workflow
      # events (e.g. `labeled`) for writes made with the default GITHUB_TOKEN,
      # so a separate checker keyed on `labeled` would never rerun after the
      # label was added. release-drafter's autolabeler block is still used at
      # draft time; these steps are what guarantee the label on every PR.
      #
      # Best-effort (continue-on-error): the verify step is the authoritative
      # check.
      - name: 🏷️ Apply label from PR title
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          # Derive the label from the conventional-commit type/prefix. The first
          # pattern already covers every `<type>!:` and `<type>(scope)!:` title.
          label=""
          case "$TITLE" in
            *"!:"*|*"BREAKING CHANGE"*|*"BREAKING-CHANGE"*) label="breaking" ;;
            feat:*|feat\(*\):*)                              label="enhancement" ;;
            fix:*|fix\(*\):*)                                label="fix" ;;
            perf:*|perf\(*\):*)                              label="performance" ;;
            refactor:*|refactor\(*\):*)                      label="refactor" ;;
            docs:*|docs\(*\):*)                              label="documentation" ;;
            security:*|security\(*\):*)                      label="security" ;;
            build:*|build\(*\):*|chore\(deps*\):*)           label="dependencies" ;;
            ci:*|ci\(*\):*|test:*|test\(*\):*|style:*|style\(*\):*|chore:*|chore\(*\):*) label="skip-changelog" ;;
            *) echo "PR title is not a recognized conventional-commit type; leaving labels alone."; exit 0 ;;
          esac
          echo "Applying label: $label"
          curl -sf -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/issues/$PR/labels" \
            -d "{\"labels\":[\"$label\"]}" >/dev/null

      # Poll the LIVE labels via the API rather than the trigger payload: the
      # write above takes a moment to be visible, and the event payload this run
      # was triggered with never carries it.
      - name: 🏷️ Categorizing label present
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          allowed="breaking enhancement bug fix performance refactor changed deprecated removed security documentation dependencies skip-changelog"
          for attempt in 1 2 3 4 5 6; do
            # No `jq` on the image: pull the "name" fields out of the labels
            # array with grep/sed.
            labels="$(curl -sf \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/issues/$PR/labels" \
              | grep -o '"name": *"[^"]*"' | sed -E 's/"name": *"([^"]*)"/\1/' || true)"
            for l in $labels; do
              for a in $allowed; do
                if [ "$l" = "$a" ]; then echo "Found categorizing label: $l"; exit 0; fi
              done
            done
            echo "No categorizing label yet (attempt $attempt/6); waiting for the autolabel step..."
            sleep 10
          done
          echo "No categorizing label present. Add one of: $allowed"
          exit 1
