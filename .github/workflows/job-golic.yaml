name: GoLic
# Verify every source file carries the MIT license header. golic (Bugs5382's own
# tool) is run through go-task (`task license`) -- the standard runner for every
# project. `golic inject --dry -x` fails the check if a header is missing; it never
# modifies files. Docs (**.md) are skipped -- they carry no header.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/**'
      - 'LICENSE'
# Pull requests only, and not while the PR is a draft. There is no rerun on
# push to main: the PR run already checked the tree being merged.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  golic:
    name: 🔏 License headers
    if: github.event.pull_request.draft == false
    runs-on: { group: self-hosted-private }
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'
      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          # setup-task reads its token from this input, not env. Without it
          # the release lookup hits the anonymous rate limit.
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify MIT headers
        run: |
          gopath="$(go env GOPATH)"
          export PATH="${PATH}:${gopath}/bin"
          task license
